# Lightweight system-wide RNNoise processing for the ME6S microphone.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "ME6S Voice Isolation"
      media.name = "ME6S Voice Isolation"
      filter.graph = {
        nodes = [
          {
            type = ladspa
            name = rnnoise
            plugin = "/home/REDACTED/.local/lib/ladspa/librnnoise_ladspa.so"
            label = noise_suppressor_mono
            control = {
              "VAD Threshold (%)" = 60.0
              "VAD Grace Period (ms)" = 250
              "Retroactive VAD Grace (ms)" = 0
            }
          }
        ]
      }
      capture.props = {
        node.name = "capture.me6s_voice_isolation"
        node.passive = true
        target.object = "alsa_input.usb-ME6S_MS_N-B_R-UN__3db_ME6S-00.mono-fallback"
        audio.rate = 48000
        audio.channels = 1
        audio.position = [ MONO ]
      }
      playback.props = {
        node.name = "me6s_voice_isolation"
        node.description = "ME6S Voice Isolation"
        media.class = Audio/Source
        audio.rate = 48000
        audio.channels = 1
        audio.position = [ MONO ]
        priority.session = 4000
      }
    }
  }
]
