#
# picom config — tuned for Intel HD Graphics 3000 (crocus/glamor), i3
# Goal: eliminate tearing on scroll/hover/animations, minimal overhead.
#

backend = "glx";
vsync = true;

# GLX-specific tuning for old Intel iGPUs: avoid the buffer-age path that
# is flaky on crocus and causes stutter/partial-frame artifacts. Drop these
# two lines on a newer/different GPU — they're a workaround, not a default.
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# Let fullscreen windows (browser F11, video players) bypass compositing
# entirely — zero overhead when it matters most.
unredirect-fullscreen-windows = true;

# No eye-candy: every one of these costs GPU time we don't have to spare.
shadow = false;
fading = false;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0;
corner-radius = 0;
blur-method = "none";

# Reduce compositor-side work; mark windows as opaque wherever possible.
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = false;
detect-client-opacity = false;
use-damage = true;

wintypes = {
  tooltip = { fade = false; shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
};
