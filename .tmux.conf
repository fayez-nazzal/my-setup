# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Pane splits stay in the active pane's directory.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Keep the tmux server alive when the last session is closed.
set -g exit-empty off
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# General defaults
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 0
set -g set-titles on
set -g set-titles-string "#{pane_current_path} — #{pane_current_command}"
set -g allow-rename off
set -g automatic-rename off
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g status-interval 15
set -g history-limit 20000

# Alacritty starts tmux from a non-interactive login zsh (see
# alacritty/alacritty.toml), and the server may also start elsewhere. Pin the
# shell tmux spawns for panes/windows explicitly so it's always zsh (and
# therefore always loads ~/.zshrc -> ~/.config/zsh, starship included)
# regardless of what $SHELL
set -g default-shell /bin/zsh

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'Nybkox/tmux-ukiyo'

# sessionx
set -g @sessionx-bind 's'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-window-mode 'off'
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-preview-enabled 'false'
set -g @sessionx-window-height '35%'
set -g @sessionx-window-width '65%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-prompt '  '
set -g @sessionx-pointer '❯ '
set -g @sessionx-custom-paths-subdirectories 'false'

# Local bindings
bind N command-prompt -p "New session name:" "new-session -s '%%'"
if-shell '[ -x "$HOME/.local/bin/histago-popup" ]' \
  'bind-key H display-popup -E -w 85% -h 80% "$HOME/.local/bin/histago-popup"'

# Pane labels. The optional badge is used only when installed.
set -g pane-border-status top
set -g pane-border-format "#[reverse] #{@label} #[noreverse]"
if-shell '[ -x "$HOME/.local/bin/tmux-claude-badge" ]' \
  'set -g pane-border-format "#[reverse] #{@label} #[noreverse] #(~/.local/bin/tmux-claude-badge #{pane_id} #{pane_width} '\''#{@label}'\'')"'
bind '\' command-prompt -p "Pane label:" "set -p @label '%%'"

# tmuxscope is optional for machines that do not install it. Prefer the
# user-local binary because tmux servers retain the PATH from startup.
if-shell '[ -x "$HOME/.local/bin/tmuxscope" ]' \
  'run-shell "PATH=\"$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin\"; export PATH; tmuxscope hook tmux 2>/dev/null | tmux source - 2>/dev/null; true"'

# ukiyo is refreshed from the system appearance by tmux/theme.sh.
set -g status-interval 5
set -g @ukiyo-plugins " "
set -g @ukiyo-refresh-rate 5
set -g @ukiyo-border-contrast true

# TPM is optional during first install; prefix + I installs the plugins afterward.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' \
  'run "$HOME/.tmux/plugins/tpm/tpm"'

# Initialize the palette and add a lightweight status-line appearance check.
run-shell 'sh "$(dirname "$(realpath "$HOME/.tmux.conf")")/tmux/theme.sh" "#{socket_path}" force'
