# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Pane splits stay in the active pane's directory.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Keep the tmux server alive when the last session is closed.
set -g exit-empty off
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# General defaults
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 0
set -g set-titles on
set -g set-titles-string "#{pane_current_path} — #{pane_current_command}"
set -g allow-rename off
set -g automatic-rename off
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g status-interval 15
set -g history-limit 20000

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'Nybkox/tmux-ukiyo'

# sessionx
set -g @sessionx-bind 's'
set -g @sessionx-window-mode 'off'
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-preview-enabled 'false'
set -g @sessionx-window-height '35%'
set -g @sessionx-window-width '65%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-prompt '  '
set -g @sessionx-pointer '❯ '
set -g @sessionx-custom-paths-subdirectories 'false'

# Local bindings
bind N command-prompt -p "New session name:" "new-session -s '%%'"
if-shell '[ -x "$HOME/.local/bin/histago-popup" ]' \
  'bind-key H display-popup -E -w 85% -h 80% "$HOME/.local/bin/histago-popup"'

# Pane labels. The optional badge is used only when installed.
set -g pane-border-status top
set -g pane-border-format "#[reverse] #{@label} #[noreverse]"
if-shell '[ -x "$HOME/.local/bin/tmux-claude-badge" ]' \
  'set -g pane-border-format "#[reverse] #{@label} #[noreverse] #(~/.local/bin/tmux-claude-badge #{pane_id} #{pane_width} '\''#{@label}'\'')"'
bind '\' command-prompt -p "Pane label:" "set -p @label '%%'"

# tmuxscope is optional for machines that do not install it.
set -g @tmuxscope-pane-path-installed 1
if-shell 'command -v tmuxscope >/dev/null 2>&1' \
  'run-shell "tmuxscope hook tmux 2>/dev/null | tmux source - 2>/dev/null; true"'

# ukiyo theme. TMUX_THEME=dark overrides the platform default.
set -g @ukiyo-plugins " "
if-shell '[ "${TMUX_THEME:-}" = dark ] || { [ "$(uname -s)" = Darwin ] && defaults read -g AppleInterfaceStyle 2>/dev/null | grep -qi dark; }' \
  'set -g @ukiyo-theme "onedark/deep" ; set -g @ukiyo-color-text "#f5f5f5" ; set -g @ukiyo-color-bg-bar "#1e2127" ; set -g @ukiyo-color-bg-pane "#282c34" ; set -g @ukiyo-color-selection "#3b4252" ; set -g @ukiyo-color-highlight "#ffffff" ; set -g @ukiyo-color-muted "#d7dae0" ; set -g @ukiyo-border-contrast true' \
  'set -g @ukiyo-theme "solarized/light" ; set -g @ukiyo-color-text "#1F2328" ; set -g @ukiyo-color-bg-bar "#E4E7EB" ; set -g @ukiyo-color-bg-pane "#F6F8FA" ; set -g @ukiyo-color-selection "#8B98A5" ; set -g @ukiyo-color-highlight "#0969DA" ; set -g @ukiyo-color-muted "#57606A" ; set -g @ukiyo-border-contrast true'

# TPM is optional during first install; prefix + I installs the plugins afterward.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' \
  'run "$HOME/.tmux/plugins/tpm/tpm"'

# ukiyo sets only the foreground by default; restore both border colors after it loads.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' \
  'run-shell "sleep 2; tmux set-option -g pane-border-style \"fg=#{@ukiyo-color-bg-bar},bg=#{@ukiyo-color-bg-pane}\" \\; set-option -g pane-active-border-style \"fg=#{@ukiyo-color-highlight},bg=#{@ukiyo-color-bg-pane}\""'
