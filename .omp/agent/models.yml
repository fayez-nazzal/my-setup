providers:
  anthropic:
    # Built-in provider: override only the Haiku 5.5 window. Pricing is unchanged,
    # so prompts above 100k input tokens still bill at the long-context rate.
    modelOverrides:
      claude-haiku-5-5:
        contextWindow: 1000000
  anthropic-api:
    # Resolved at runtime by op with the scoped OMP service account.
    apiKey: "!op read \"op://OMP/OMP ANTHROPIC/password\" --no-newline"
    api: anthropic-messages
    baseUrl: https://api.anthropic.com
    models:
      - id: claude-fable-5-1
        name: "Claude Fable 5.1 (API)"
        reasoning: true
        input:
          - text
          - image
        contextWindow: 1000000
        maxTokens: 128000
        cost:
          input: 10.00
          output: 50.00
          cacheRead: 0.25
          cacheWrite: 12.5
      - id: claude-sonnet-5
        name: "Claude Sonnet 5"
        reasoning: true
        input:
          - text
          - image
        contextWindow: 1000000
        maxTokens: 128000
        cost:
          input: 2.00
          output: 10.00
          cacheRead: 0.20
          cacheWrite: 2.5
      - id: claude-opus-5-5
