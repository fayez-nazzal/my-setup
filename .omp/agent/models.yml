          cacheWrite: 1.25
  openai-api:
    # Resolved at runtime by op with the scoped OMP service account.
    apiKey: "!op read \"op://OMP/OMP OPENAI/password\" --no-newline"
    api: openai-responses
    baseUrl: https://api.openai.com/v1
