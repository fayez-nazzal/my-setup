symbolPreset: nerd
composer:
  shape: box
  tokenRate: true
theme:
  dark: dark-dracula
  light: light-cyberpunk
setupVersion: 2
colorBlindMode: false
statusLine:
  preset: nerd
  separator: powerline
  contextLine: annotated
  sessionAccent: true
  transparent: true
tui:
  resizeScrollback: rebuild
  tight: false
  vimMode: true
  vimModeDisplay: text
display:
  showTokenUsage: true
  shimmer: kitt
defaultThinkingLevel: auto
hideThinkingBlock: true
steeringMode: all
followUpMode: all
modelRoles:
  writer: openai-codex/gpt-6.1-sol:high
  web: web/perplexity
  default: anthropic/claude-opus-5-5:high
  tiny: camel-stream/auto:medium
  commit: openai-codex/gpt-6-luna:high
  task: openai-codex/gpt-6-luna:medium
  plan: anthropic/claude-opus-5-5:max
  vision: anthropic-api/claude-sonnet-5:medium
  advisor: openai-codex/gpt-6-sol:medium
  image: openai-codex/gpt-image-1:auto
  speech: local/kokoro:auto
  judge: anthropic-api/claude-opus-5-5:high
  slow: openai-codex/gpt-6.1-sol:medium
  memory: anthropic/claude-opus-5-5
  smol: openai-codex/gpt-6-luna
retry:
  fallbackChains:
    slow:
      - openai-codex/gpt-6.1-sol
    smol:
      - openai-codex/gpt-6-luna
    tiny:
      - openai-api/gpt-6-luna
    commit:
      - openai-api/gpt-6-luna
    task:
      - openai-api/gpt-6-luna
    plan:
      - openai-codex/gpt-6.1-sol
    advisor:
      - openai-api/gpt-6-sol
    default:
      - openai-codex/gpt-6.1-sol
    judge:
      - openai-codex/gpt-6.1-sol
dev:
  autoqaConsent: denied
cycleOrder:
  - smol
  - default
  - slow
  - tiny