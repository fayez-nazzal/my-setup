symbolPreset: nerd
composer:
  shape: box
  tokenRate: true
theme:
  dark: dark-dracula
  light: light-cyberpunk
setupVersion: 2
colorBlindMode: false
statusLine:
  preset: nerd
  separator: powerline
  contextLine: annotated
  sessionAccent: true
  transparent: true
tui:
  resizeScrollback: rebuild
  tight: false
  vimMode: true
  vimModeDisplay: text
display:
  showTokenUsage: true
  shimmer: kitt
defaultThinkingLevel: medium
hideThinkingBlock: true
steeringMode: all
followUpMode: all
modelRoles:
  slow: anthropic/claude-opus-5:medium
  writer: openai-api/gpt-6-astra:high
  smol: openai-codex/gpt-5.6-luna:medium
  web: web/perplexity
  default: openai-codex/gpt-5.6-luna:medium
retry:
  fallbackChains:
    web:
      - web/duckduckgo
    default:
      - anthropic/claude-sonnet-5
    smol:
      - anthropic/claude-sonnet-5