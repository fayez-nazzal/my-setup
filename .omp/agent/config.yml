symbolPreset: nerd
composer:
  shape: box
  tokenRate: true
theme:
  dark: dark-dracula
  light: light-cyberpunk
setupVersion: 2
colorBlindMode: false
statusLine:
  preset: nerd
  separator: powerline
  contextLine: annotated
  sessionAccent: true
  transparent: true
tui:
  resizeScrollback: rebuild
  tight: false
  vimMode: true
  vimModeDisplay: text
display:
  showTokenUsage: true
  shimmer: kitt
defaultThinkingLevel: auto
hideThinkingBlock: true
steeringMode: all
followUpMode: all
modelRoles:
  slow: openai-codex/gpt-6-sol:high
  writer: anthropic-api/claude-sonnet-5:medium
  web: web/perplexity
  default: openai-codex/gpt-6-sol:medium
  smol: openai-codex/gpt-6-luna:low
  tiny: openai-codex/gpt-6-luna:minimal
  commit: openai-codex/gpt-6-luna:high
  task: openai-codex/gpt-6-luna:medium
  plan: openai-codex/gpt-6-sol:high
  vision: anthropic-api/claude-sonnet-5:medium
  advisor: openai-codex/gpt-6-sol:medium
  image: openai-codex/gpt-image-1:auto
  speech: local/kokoro:auto
  judge: anthropic-api/claude-opus-5-5:high
retry:
  fallbackChains:
    default:
      - openai-api/gpt-6-luna
      - camel-stream/auto
    slow:
      - openai-codex/gpt-6-sol
      - openai-api/gpt-6-sol
      - camel-stream/auto
    writer:
      - camel-stream/auto
    smol:
      - openai-api/gpt-6-luna
      - camel-stream/auto
    tiny:
      - openai-api/gpt-6-luna
      - camel-stream/auto
    commit:
      - openai-api/gpt-6-luna
      - camel-stream/auto
    task:
      - openai-api/gpt-6-luna
      - camel-stream/auto
    plan:
      - openai-api/gpt-6-sol
      - camel-stream/auto
    vision:
      - camel-stream/auto
    advisor:
      - openai-api/gpt-6-sol
      - camel-stream/auto
    judge:
      - camel-stream/auto
dev:
  autoqaConsent: denied