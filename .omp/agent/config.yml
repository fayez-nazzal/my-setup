symbolPreset: nerd
composer:
  shape: box
  tokenRate: true
theme:
  dark: dark-dracula
  light: light-cyberpunk
setupVersion: 2
colorBlindMode: false
statusLine:
  preset: nerd
  separator: powerline
  contextLine: annotated
  sessionAccent: true
  transparent: true
tui:
  resizeScrollback: rebuild
  tight: false
  vimMode: true
  vimModeDisplay: text
display:
  showTokenUsage: true
  shimmer: kitt
defaultThinkingLevel: auto
hideThinkingBlock: true
steeringMode: all
followUpMode: all
modelRoles:
  writer: openrouter/google/gemini-4-argon:high
  web: web/perplexity
  default: openai-codex/gpt-6.1-terra
  tiny: minimax-code/MiniMax-M3.1-Flash:auto
  commit: minimax-code/MiniMax-M3.1-Flash:auto
  task: anthropic/claude-haiku-5-5:auto
  plan: anthropic/claude-opus-5-5:high
  vision: openai-codex/gpt-6.1-terra:auto
  advisor: kimi-code/k3.1-pro:low
  image: openai-codex/gpt-image-1:auto
  speech: local/kokoro
  slow: openai-codex/gpt-6.1-sol:auto
  judge: openai-codex/gpt-6.1-sol:auto
  memory: openai-codex/gpt-6.1-sol:auto
  smol: openai-codex/gpt-6-luna:auto
  dictation: local/parakeet-tdt-0.6b-v3
  review: openai-codex/gpt-6.1-sol:auto
  SECONDARY: openai-codex/gpt-6.1-sol:auto
  EXTREME: openai-codex/gpt-6-astra:max
retry:
  fallbackChains:
    plan:
      - openai-codex/gpt-6.1-sol
      - kimi-code/k3.1-pro
    memory:
      - anthropic/claude-sonnet-5-5
      - minimax-code/MiniMax-M3.1-Flash
    task:
      - openai-codex/gpt-6-luna
      - minimax-code/MiniMax-M3.1-Flash
    writer:
      - anthropic/claude-opus-5-5
      - openai-codex/gpt-6.1-sol
    smol:
      - minimax-code/MiniMax-M3.1-Flash
    judge:
      - anthropic/claude-sonnet-5-5
    tiny:
      - openai-codex/gpt-6-luna
      - anthropic/claude-haiku-5-5
    commit:
      - openai-codex/gpt-6-luna
      - anthropic/claude-haiku-5-5
    advisor:
      - anthropic/claude-sonnet-5-5
      - minimax-code/MiniMax-M3.1-Flash
    review:
      - anthropic/claude-haiku-5-5
      - openai-codex/gpt-6.1-sol
      - minimax-code/MiniMax-M3.1-Flash
    SECONDARY:
      - anthropic/claude-opus-5-5
      - openai-codex/gpt-6.1-sol
    EXTREME:
      - anthropic/claude-opus-5-5
      - openai-codex/gpt-6-astra
    default:
      - anthropic/claude-sonnet-5-5
    slow:
      - openai-codex/gpt-6.1-terra
      - kimi-code/k3.1-pro
    vision:
      - anthropic/claude-sonnet-5-5
      - minimax-code/MiniMax-M3.1-Flash
  waitForUsageReset: true
dev:
  autoqaConsent: denied
cycleOrder:
  - smol
  - default
  - slow
  - tiny
  - review
  - SECONDARY
  - EXTREME
github:
  enabled: true
speechgen:
  enabled: true
astGrep:
  enabled: true
security:
  enabled: true
bash:
  patterns:
    - match: op
      approval: deny
    - match: op *
      approval: deny
    - match: "*/op"
      approval: deny
    - match: "*/op *"
      approval: deny
    - match: "* op"
      approval: deny
    - match: "* op *"
      approval: deny
checkpoint:
  enabled: true
computer:
  enabled: false
codexResets:
  autoRedeem: "no"
claudeResets:
  autoRedeem: "no"
extendedContext: false