symbolPreset: nerd
composer:
  shape: box
  tokenRate: true
theme:
  dark: dark-dracula
  light: light-cyberpunk
setupVersion: 2
colorBlindMode: false
statusLine:
  preset: nerd
  separator: powerline
  contextLine: annotated
  sessionAccent: true
  transparent: true
tui:
  resizeScrollback: rebuild
  tight: false
  vimMode: true
  vimModeDisplay: text
display:
  showTokenUsage: true
  shimmer: kitt
defaultThinkingLevel: auto
hideThinkingBlock: true
steeringMode: all
followUpMode: all
modelRoles:
  writer: openrouter/google/gemini-4-argon:high
  web: web/perplexity
  default: openrouter/deepseek/deepseek-v4.1-flash-1017
  tiny: openai-codex/gpt-6-luna:auto
  commit: openai-codex/gpt-6-luna:auto
  task: openai-codex/gpt-6-luna:auto
  plan: anthropic/claude-opus-5-5:high
  vision: openai-codex/gpt-6-luna:auto
  advisor: openai-codex/gpt-6.1-sol:auto
  image: openai-codex/gpt-image-1:auto
  speech: local/kokoro
  memory: anthropic/claude-opus-5-5:off
  smol: openai-codex/gpt-6-luna:auto
  slow: openai-codex/gpt-6.1-sol:medium
  judge: openai-codex/gpt-6.1-sol:auto
  dictation: local/parakeet-tdt-0.6b-v3
retry:
  fallbackChains:
    plan:
      - openai-codex/gpt-6.1-sol
    memory:
      - openai-codex/gpt-6.1-sol
    default:
      - openai-codex/gpt-6-luna
    smol:
      - anthropic/claude-haiku-5-5
    task:
      - anthropic/claude-haiku-5-5
dev:
  autoqaConsent: denied
cycleOrder:
  - smol
  - default
  - slow
  - tiny
github:
  enabled: true
speechgen:
  enabled: true
astGrep:
  enabled: true
security:
  enabled: true
checkpoint:
  enabled: true
computer:
  enabled: false
codexResets:
  autoRedeem: "no"
claudeResets:
  autoRedeem: "no"