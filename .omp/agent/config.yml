symbolPreset: nerd
composer:
  shape: box
  tokenRate: true
theme:
  dark: dark-dracula
  light: light-cyberpunk
setupVersion: 2
colorBlindMode: false
statusLine:
  preset: nerd
  separator: powerline
  contextLine: annotated
  sessionAccent: true
  transparent: true
tui:
  resizeScrollback: rebuild
  tight: false
  vimMode: true
  vimModeDisplay: text
display:
  showTokenUsage: true
  shimmer: kitt
defaultThinkingLevel: auto
hideThinkingBlock: true
steeringMode: all
followUpMode: all
modelRoles:
  writer: anthropic/claude-opus-5-5:auto
  web: web/perplexity
  tiny: openai-codex/gpt-6-luna:auto
  commit: anthropic/claude-haiku-5-5:auto
  task: anthropic/claude-haiku-5-5:auto
  plan: anthropic/claude-opus-5-5:max
  vision: openai-codex/gpt-6-luna:auto
  advisor: openai-codex/gpt-6.1-sol:auto
  image: openai-codex/gpt-image-1:auto
  speech: local/kokoro
  memory: anthropic/claude-opus-5-5:off
  smol: anthropic/claude-haiku-5-5:auto
  slow: openai-codex/gpt-6.1-sol:auto
  judge: anthropic/claude-opus-5-5:auto
  dictation: local/parakeet-tdt-0.6b-v3
  default: anthropic/claude-sonnet-5-5
retry:
  fallbackChains:
    plan:
      - openai-codex/gpt-6.1-sol
    memory:
      - openai-codex/gpt-6.1-sol
    task:
      - openai-codex/gpt-6-luna
    slow:
      - openai-codex/gpt-6.1-sol
    writer:
      - openai-codex/gpt-6.1-sol
    smol:
      - openai-codex/gpt-6-luna
    judge:
      - openai-codex/gpt-6.1-sol
    tiny:
      - openai-codex/gpt-6-luna
    commit:
      - openai-codex/gpt-6-luna
dev:
  autoqaConsent: denied
cycleOrder:
  - smol
  - default
  - slow
  - tiny
github:
  enabled: true
speechgen:
  enabled: true
astGrep:
  enabled: true
security:
  enabled: true
checkpoint:
  enabled: true
computer:
  enabled: false
codexResets:
  autoRedeem: "no"