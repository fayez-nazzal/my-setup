# Device-scoped Mac-style shortcuts for Apple Magic Keyboard 05ac:029c.
# Physical Control and Alt never enter this layer and remain unchanged.
[ids]
05ac:029c

[main]
leftmeta = layer(command)
rightmeta = layer(command)

# Disable Caps Lock; emit F13 so i3 can bind it (e.g. fullscreen toggle).
capslock = f13

# ISO extra key (physically between left Shift and Z, keycap shows `/~)
# defaults to the Linux KEY_102ND usage (</>/| under the "us" X layout).
# Remap it to send the same code as the grave key so it produces `/~
# like the keycap indicates, matching the existing "us" X layout for free.
102nd = grave

# Ctrl inheritance supplies Cmd+A/Z/Shift+Z/S/F and standard Cmd behavior.
# Insert/Delete chords provide copy/paste/cut without turning physical Ctrl+C
# into a terminal copy shortcut.
[command:C]
c = C-insert
p = S-insert
v = S-insert
x = S-delete
space = M-space
