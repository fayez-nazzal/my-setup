# AeroSpace configuration
#
# Portable by design:
# - monitor assignments use semantic selectors (`main`/`secondary`), not names
# - helper scripts resolve through $HOME, not a machine-specific username
# - window rules use the table-based `if.*` predicate syntax (this AeroSpace
#   build does not support the newer `test %{...}` shell-like predicate string)
#
# AeroSpace does not support TOML variables, includes, or generated keys. Keep
# workspace names and key bindings explicit: they are part of the public
# keyboard contract, while machine-specific values belong in the selectors below.
#
# Current workspace usage:
#   1 -> Terminal (Ghostty)      3 -> Editor (Zed/Cursor)   P -> 1Password
#   2 -> Browser (Chrome)        4 -> MS Teams (all windows) O -> Obsidian
#   S -> Safari                  X -> XMind
#   Q, W -> free for anything else

config-version = 2
start-at-login = true
automatically-unhide-macos-hidden-apps = true

# Keep i3-like behavior. Enable these when you want AeroSpace to normalize
# manually-created container trees.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Mouse follows focus without needlessly jumping when it is already centered.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# Workspaces that should exist even before a window is assigned to them.
persistent-workspaces = ['1', '2', '3', '4', 'P', 'O', 'X', 'S', 'Q', 'W']

# Window rules are expressed as one TOML array so rule order is visible and
# easy to move/share. The first matching callback wins unless it opts in to
# check-further-callbacks.
on-window-detected = [
  { if.app-id = 'com.mitchellh.ghostty', run = ['layout tiling', 'move-node-to-workspace 1'] },
  { if.app-id = 'com.google.Chrome', run = ['move-node-to-workspace 2'] },
  { if.app-id = 'dev.zed.Zed', run = ['move-node-to-workspace 3'] },
  { if.app-name-regex-substring = 'Cursor', run = ['move-node-to-workspace 3'] },
  { if.app-id = 'com.microsoft.teams2', run = ['move-node-to-workspace 4'] },
  { if.app-id = 'com.1password.1password', run = ['move-node-to-workspace P'] },
  { if.app-id = 'md.obsidian', run = ['layout tiling', 'move-node-to-workspace O', 'exec-and-forget $HOME/.config/aerospace/obsidian-fullscreen.sh'] },
  { if.app-name-regex-substring = 'XMind', run = ['move-node-to-workspace X'] },
  { if.app-id = 'com.apple.Safari', run = ['move-node-to-workspace S'] },
]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[mode.main.binding]
# Smart Ghostty summon: focus the single window if open, else launch it.
alt-enter = 'exec-and-forget $HOME/.config/aerospace/ghostty.sh'

# i3-style focus wrapping.
alt-j = 'focus --boundaries-action wrap-around-the-workspace left'
alt-k = 'focus --boundaries-action wrap-around-the-workspace down'
alt-l = 'focus --boundaries-action wrap-around-the-workspace up'
alt-semicolon = 'focus --boundaries-action wrap-around-the-workspace right'

alt-shift-j = 'move left'
alt-shift-k = 'move down'
alt-shift-l = 'move up'
alt-shift-semicolon = 'move right'

alt-shift-backslash = 'split horizontal'
alt-minus = 'split vertical'
f18 = 'fullscreen' # Caps Lock, remapped via hidutil LaunchAgent.
alt-period = 'layout floating tiling'

# Workspace focus.
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'
alt-s = 'workspace S'
alt-q = 'workspace Q'
alt-w = 'workspace W'
alt-p = 'workspace P'
alt-o = 'workspace O'
alt-x = 'workspace X'

# Move the focused window to a workspace.
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'
alt-shift-q = 'move-node-to-workspace Q'
alt-shift-w = 'move-node-to-workspace W'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-p = 'move-node-to-workspace P'
alt-shift-o = 'move-node-to-workspace O'
alt-shift-x = 'move-node-to-workspace X'

alt-e = 'mode resize'
alt-shift-e = 'reload-config'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
