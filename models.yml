providers:
  anthropic-api:
    # Replace the placeholder with your 1Password secret reference.
    apiKey: "!op read op://Personal/OMP ANTHROPIC/credential --no-newline"
    api: anthropic-messages
    baseUrl: https://api.anthropic.com
    models:
      - id: claude-fable-5-1
        name: "Claude Fable 5.1 (API)"
        reasoning: true
        input:
          - text
          - image
        contextWindow: 1000000
        maxTokens: 128000
        cost:
          input: 10.00
          output: 50.00
          cacheRead: 0.25
          cacheWrite: 12.5
      - id: claude-sonnet-5
        name: "Claude Sonnet 5"
        reasoning: true
        input:
          - text
          - image
        contextWindow: 1000000
        maxTokens: 128000
        cost:
          input: 2.00
          output: 10.00
          cacheRead: 0.20
          cacheWrite: 2.5
      - id: claude-opus-5
        name: "Claude Opus 5"
        reasoning: true
        input:
          - text
          - image
        contextWindow: 1000000
        maxTokens: 128000
        cost:
          input: 5.00
          output: 25.00
          cacheRead: 0.50
          cacheWrite: 6.25
      - id: claude-haiku-4-5
        name: "Claude Haiku 4.5"
        reasoning: true
        input:
          - text
          - image
        contextWindow: 200000
        maxTokens: 64000
        cost:
          input: 1.00
          output: 5.00
          cacheRead: 0.10
          cacheWrite: 1.25
  default: openai-codex/gpt-5.6-luna:medium
