[desktop/interface]
monospace-font-name='GeistMono Nerd Font Mono 11'


[mutter]
dynamic-workspaces=false
workspaces-only-on-primary=true

[desktop/wm/preferences]
num-workspaces=12
workspace-names=['1: Editor', '2: Browser', '3: Cursor', '4: Teams', '5', '6', '7', '8', '9', '10', 'G: Terminal', 'P: 1Password']
focus-mode='click'

[desktop/wm/keybindings]
switch-to-workspace-1=['<Alt>1']
switch-to-workspace-2=['<Alt>2']
switch-to-workspace-3=['<Alt>3']
switch-to-workspace-4=['<Alt>4']
switch-to-workspace-5=['<Alt>5']
switch-to-workspace-6=['<Alt>6']
switch-to-workspace-7=['<Alt>7']
switch-to-workspace-8=['<Alt>8']
switch-to-workspace-9=['<Alt>9']
switch-to-workspace-10=['<Alt>0']
switch-to-workspace-11=['<Alt>g']
switch-to-workspace-12=['<Alt>p']
move-to-workspace-1=['<Shift><Alt>1']
move-to-workspace-2=['<Shift><Alt>2']
move-to-workspace-3=['<Shift><Alt>3']
move-to-workspace-4=['<Shift><Alt>4']
move-to-workspace-5=['<Shift><Alt>5']
move-to-workspace-6=['<Shift><Alt>6']
move-to-workspace-7=['<Shift><Alt>7']
move-to-workspace-8=['<Shift><Alt>8']
move-to-workspace-9=['<Shift><Alt>9']
move-to-workspace-10=['<Shift><Alt>0']
move-to-workspace-11=['<Shift><Alt>g']
move-to-workspace-12=['<Shift><Alt>p']
toggle-fullscreen=['<F13>']
switch-windows=['<Alt>Tab']
switch-windows-backward=['<Shift><Alt>Tab']
switch-input-source=@as []
switch-input-source-backward=@as []

[settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom3/']

[settings-daemon/plugins/media-keys/custom-keybindings/custom0]
name='Rofi (Command+Space)'
command='rofi -show drun'
binding='<Super>space'
enable-in-lockscreen=false

[settings-daemon/plugins/media-keys/custom-keybindings/custom1]
name='Rofi (Alt+D)'
command='rofi -show drun'
binding='<Alt>d'
enable-in-lockscreen=false

[settings-daemon/plugins/media-keys/custom-keybindings/custom2]
name='Alacritty'
command='alacritty'
binding='<Alt>Return'
enable-in-lockscreen=false

[settings-daemon/plugins/media-keys/custom-keybindings/custom3]
name='Lock screen'
command='loginctl lock-session'
binding='<Alt><Shift>Insert'
enable-in-lockscreen=false
