# GitHub tools: the single source of truth for which of the owner's repositories
# are cloned, built from source, linked onto PATH, and kept current. Both
# ./install.sh and the twice-daily cron job run `tools/sync.sh`, which reads
# this file. Edit GITHUB_TOOLS to add, drop, or change a tool; the next sync
# applies it. Sourced by bash 3.2 (macOS cron), so keep it plain bash.

GITHUB_TOOLS_OWNER="fayez-nazzal"
GITHUB_TOOLS_DIR="${GITHUB_TOOLS_DIR:-$HOME/tools}"
GITHUB_TOOLS_BIN="${GITHUB_TOOLS_BIN:-$HOME/.local/bin}"
# Earlier checkout location; a checkout found here is moved instead of re-cloned.
GITHUB_TOOLS_PREVIOUS_DIR="$HOME/repos/tools"
# crontab schedule for `sync.sh sync --log`: twice a day, 09:17 and 21:17 local time.
GITHUB_TOOLS_CRON="17 9,21 * * *"

# One entry per tool, fields separated by "|" (spaces around fields are ignored):
#   name       repository github.com/$GITHUB_TOOLS_OWNER/<name>, cloned to $GITHUB_TOOLS_DIR/<name>
#   platforms  "darwin", "linux", or both
#   build      command run inside the checkout after a clone or update; empty for none.
#              Helpers: bun_deps (bun install, --frozen-lockfile when bun.lock is tracked),
#              nag_agent (register nag's launchd agent).
#   links      checkout-relative files symlinked into $GITHUB_TOOLS_BIN, space-separated,
#              as path or path:command; empty for none
GITHUB_TOOLS=(
  "tmuxscope               | darwin linux | bun_deps && bun run build                                    | dist/tmuxscope"
  "browsershot             | darwin linux | bun_deps && bunx playwright install chromium && bun run build | dist/browsershot"
  "termshot                | darwin       | bun_deps && bun run build                                    | dist/termshot"
  "nag                     | darwin       | bun_deps && nag_agent                                        | src/cli.ts:nag"
  "next-step               | darwin linux | bun_deps && bun run build                                    | dist/next-step"
  "chrome-domain-tab-saver | darwin linux |                                                              |"
)
