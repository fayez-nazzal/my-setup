# One default window owns the shared tmux session, even after tmuxscope renames it.
# A duplicate default launch focuses the existing Mac window and exits.
# Explicit `alacritty -e CMD` bypasses this guard and remains independent.
[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", 'source "$HOME/.local/bin/my-setup-alacritty-shell"']

[font]
size = 11.0

[font.normal]
family = "GeistMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "GeistMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "GeistMono Nerd Font Mono"
style = "Italic"

# keyd's [command:C] layer (see ../keyd/) emits these application-neutral
# editing chords for Command+C/P/V, since terminals can't tell a raw Ctrl+C
# (SIGINT) from a Cmd+C-turned-Ctrl+C without a distinct keysym.
[[keyboard.bindings]]
key = "Insert"
mods = "Control"
action = "Copy"

[[keyboard.bindings]]
key = "Insert"
mods = "Shift"
action = "Paste"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
